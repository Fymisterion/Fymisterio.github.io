name: Dranbleiben bauen

on:
  push:
    paths:
      - "dranbleiben/**"
      - ".github/workflows/dranbleiben.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dranbleiben
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests und Debug-APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dranbleiben-debug-apk
          path: dranbleiben/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
